<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Bilik</title>
<style>
  :root{ --ink:#0b0b0c; --muted:#6b7280; --line:#e5e7eb; --accent:hsl(221 83% 53%); }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fff}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 32px;border-bottom:1px solid var(--line)}
  .brand{font-weight:900;letter-spacing:-.04em;font-size:22px;text-transform:uppercase}
  .brand span{color:var(--accent)}
  .tag{color:var(--muted);font-size:13px}
  main{max-width:920px;margin:0 auto;padding:36px 24px 80px}
  h1{font-size:44px;line-height:1;letter-spacing:-.04em;text-transform:uppercase;font-weight:900;margin:8px 0 10px}
  p.lead{color:var(--muted);margin:0 0 26px;font-size:15px}
  #drop{border:2px dashed var(--line);border-radius:.75rem;padding:46px 24px;text-align:center;transition:.15s;background:#fafafa}
  #drop.hot{border-color:var(--accent);background:hsl(221 83% 97%)}
  #drop b{display:block;font-size:17px;margin-bottom:6px}
  #drop small{color:var(--muted)}
  .btn{display:inline-block;margin-top:14px;background:var(--ink);color:#fff;border:0;border-radius:.75rem;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .card{border:1px solid var(--line);border-radius:.75rem;padding:18px;margin-top:16px}
  .card.active{border-color:var(--accent);box-shadow:0 0 0 3px hsl(221 83% 96%)}
  .row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
  .name{font-weight:700;font-size:15px}
  .meta{color:var(--muted);font-size:13px;margin-top:4px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#f3f4f6;padding:2px 6px;border-radius:6px}
  .pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
  .acts{display:flex;gap:8px;flex-shrink:0}
  .acts button{background:#fff;border:1px solid var(--line);border-radius:.6rem;padding:8px 12px;font-size:13px;cursor:pointer}
  .acts button:hover{border-color:var(--ink)}
  #msg{margin-top:16px;font-size:14px;min-height:20px}
  #msg.err{color:#dc2626}
  #msg.ok{color:#059669}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:34px 0 6px}
</style>
</head>
<body>
<header>
  <div class="brand">BILIK<span>.</span></div>
  <div class="tag">Ruang ujian tanpa kunci</div>
</header>
<main>
  <h1>Tarik config<br>SEB ke sini</h1>
  <p class="lead">Setiap quiz punya file <code>.seb</code> sendiri. Tarik filenya, Bilik hitung config key-nya dan langsung buka quiz.</p>

  <div id="drop">
    <b>Tarik file .seb ke sini</b>
    <small>atau tempel isi XML-nya, atau pilih file</small>
    <div><button class="btn" id="pick">Pilih file .seb</button></div>
    <input type="file" id="file" accept=".seb,text/xml,application/xml" hidden>
  </div>

  <div id="msg"></div>

  <h2>Config tersimpan</h2>
  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
function msg(t, cls){ const m=$("#msg"); m.textContent=t||""; m.className=cls||""; }
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function refresh(){
  const r = await fetch("/api/state").then(r=>r.json());
  const list = $("#list"); list.innerHTML = "";
  if(!r.configs.length){ list.innerHTML = '<div class="meta">Belum ada config.</div>'; return; }
  for(const c of r.configs){
    const isActive = r.active && c.id === r.active.id;
    const el = document.createElement("div");
    el.className = "card" + (isActive ? " active" : "");
    el.innerHTML = `
      <div class="row">
        <div>
          <div class="name">${esc(c.filename)} ${isActive?'<span class="pill">aktif</span>':''}</div>
          <div class="meta">${esc(c.host)} &middot; cmid ${c.cmid ?? "-"} &middot; ${esc(c.importedAt)}</div>
          <div class="meta">key <code>${esc((c.configKey||"").slice(0,16))}…</code></div>
        </div>
        <div class="acts">
          <button data-open="${esc(c.startURL)}">Buka</button>
          <button data-act="${esc(c.id)}">Aktifkan</button>
          <button data-del="${esc(c.id)}">Hapus</button>
        </div>
      </div>`;
    list.appendChild(el);
  }
  list.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    window.open(b.dataset.open, "_blank");
  });
  list.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    await fetch("/api/activate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.dataset.act})});
    msg("Config diaktifkan.", "ok"); refresh();
  });
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    await fetch("/api/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.dataset.del})});
    msg("Config dihapus."); refresh();
  });
}

async function install(content, filename){
  msg("Memproses…");
  const r = await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({content, filename})}).then(r=>r.json());
  if(!r.ok){ msg(r.error || "Gagal import.", "err"); return; }
  msg(`Config terpasang: ${r.config.filename} — quiz dibuka di tab baru.`, "ok");
  refresh();
}

const dz = $("#drop");
["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault();dz.classList.add("hot")}));
["dragleave","drop"].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault();dz.classList.remove("hot")}));
dz.addEventListener("drop", async e=>{
  const f = e.dataTransfer.files[0]; if(!f) return;
  install(await f.text(), f.name);
});
$("#pick").onclick = ()=> $("#file").click();
$("#file").onchange = async e=>{ const f=e.target.files[0]; if(f) install(await f.text(), f.name); };
window.addEventListener("dragover", e=>e.preventDefault());
window.addEventListener("drop", async e=>{
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if(f && !dz.contains(e.target)) install(await f.text(), f.name);
});
refresh();
</script>
</body>
</html>
