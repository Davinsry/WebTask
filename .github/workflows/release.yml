name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -eq "workflow_dispatch") { $ver = "dev" }
          $stage = "dist\webtask-$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\webtask.exe" "$stage\WebTask.exe"
          Copy-Item "LICENSE" "$stage\LICENSE.txt"
          Copy-Item "README.md" "$stage\README.md"
          Copy-Item "assets\logo.svg" "$stage\logo.svg"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\webtask-$ver-x86_64-pc-windows-msvc.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webtask-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true