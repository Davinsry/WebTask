<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebTask</title>
<style>
  :root{
    --bg:#FAF9F7; --surface:#FFFFFF; --ink:#16181D; --ink-2:#5A5F6B;
    --line:#E4E1DB; --line-2:#CFCAC1; --accent:#1F4E79; --accent-ink:#FFFFFF;
    --accent-soft:#EAF0F6; --ok:#1F7A4D; --ok-soft:#E8F3EC; --bad:#B3261E; --bad-soft:#FBEAE9;
    --r-control:6px; --r-panel:10px;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
    --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;display:flex;flex-direction:column;
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;font-size:16px}
  .brand svg{flex:none;display:block}
  .brand .dot{color:var(--accent)}
  .brand-sub{color:var(--ink-2);font-size:12px}

  main{flex:1;overflow:auto;scroll-padding-top:24px}
  .wrap{max-width:760px;margin:0 auto;padding:32px 28px 64px}

  h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;font-weight:650;margin:0 0 8px}
  .lead{color:var(--ink-2);margin:0 0 24px;max-width:52ch}
  .lead code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);color:var(--accent);
    padding:1px 5px;border-radius:4px}

  .btn{
    font:inherit;font-weight:600;font-size:13px;cursor:pointer;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
    border-radius:var(--r-control);padding:8px 14px;
    transition:border-color .12s ease,background .12s ease;
  }
  .btn:hover{border-color:var(--ink-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:#1a4266;border-color:#1a4266}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.small{padding:5px 10px;font-size:12px;font-weight:600}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}

  #msg{margin-top:14px;font-size:13px;min-height:20px;display:flex;align-items:center;gap:7px}
  #msg:empty{display:none}
  #msg .mark{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
  #msg.ok{color:var(--ok)} #msg.ok .mark{background:var(--ok)}
  #msg.err{color:var(--bad)} #msg.err .mark{background:var(--bad)}
  #msg.busy{color:var(--ink-2)}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 10px}
  h2{font-size:14px;font-weight:650;margin:0}
  .count{color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}

  /* Daftar config: baris keputusan, bukan grid kartu seragam */
  .list{border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);overflow:hidden}
  .item{display:flex;gap:16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item.current{box-shadow:inset 3px 0 0 var(--accent)}
  .item .body{min-width:0;flex:1}
  .item .name{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .item .name .file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
  .status.on{color:var(--ok);background:var(--ok-soft)}
  .item .meta{color:var(--ink-2);font-size:12.5px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .item .meta .cmid{font-variant-numeric:tabular-nums}
  .item .key{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:4px;
    display:inline-flex;align-items:center;gap:6px}
  .item .key .val{color:var(--ink)}
  .acts{display:flex;gap:6px;flex:none}
  .acts .open{display:inline-flex;align-items:center;gap:5px}

  .empty{padding:22px 16px;color:var(--ink-2);font-size:13px}
  .empty strong{color:var(--ink);font-weight:600}
  .empty .next{display:block;margin-top:3px}

  .foot{margin-top:28px;color:var(--ink-2);font-size:12px}
  .foot code{font-family:var(--mono)}

  /* Pemilih mode: dua pilihan besar, satu keputusan */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 28px}
  .mode{
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
    padding:16px 18px;border:1.5px solid var(--line-2);border-radius:var(--r-panel);
    background:var(--surface);cursor:pointer;font:inherit;color:var(--ink);
    transition:border-color .12s ease,background .12s ease;
  }
  .mode:hover{border-color:var(--ink-2)}
  .mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .mode .m-name{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px}
  .mode .m-desc{color:var(--ink-2);font-size:12.5px;line-height:1.45}
  .mode[aria-pressed="true"] .m-name{color:var(--accent)}

  /* ---- overlay pilih mode ----
     Jendela dibuka kecil; overlay ini memenuhi seluruh area dan baru hilang
     setelah user memilih. */
  body.picking{overflow:hidden}
  body.picking #shell{display:none}
  #pick{
    position:fixed;inset:0;z-index:10;display:flex;
    background:var(--bg);overflow:auto;
  }
  #pick[hidden]{display:none}
  .pick-card{display:flex;flex-direction:column;width:100%}
  .pick-head{
    display:flex;align-items:center;gap:8px;padding:12px 16px;
    font-weight:700;font-size:14px;letter-spacing:-.01em;
  }
  .pick-body{padding:0 16px 18px;display:flex;flex-direction:column;flex:1}
  .pick-body h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0 0 4px}
  .pick-body .lead{color:var(--ink-2);font-size:12.5px;margin:0 0 14px}
  .pick-body .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
  .pick-body .mode{padding:13px 14px;gap:4px}
  .pick-body .mode .m-name{font-size:13.5px}
  .pick-body .mode .m-desc{font-size:11.5px;line-height:1.4}
  #pickmsg{margin-top:12px;font-size:12px;color:var(--ink-2);min-height:16px}
  #pickmsg:empty{display:none}

  @media (max-width:560px){
    .wrap{padding:24px 16px 48px}
    h1{font-size:23px}
    .modes{grid-template-columns:1fr}
    .item{flex-direction:column;align-items:stretch;gap:10px}
    .acts{justify-content:flex-start}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div id="pick" hidden>
  <div class="pick-card">
    <header class="pick-head">
      <svg width="20" height="20" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M16 8H42L54 20V50C54 53.314 51.314 56 48 56H16C12.686 56 10 53.314 10 50V14C10 10.686 12.686 8 16 8Z" fill="#0F172A"/>
        <path d="M42 8V16C42 18.209 43.791 20 46 20H54L42 8Z" fill="#2563EB"/>
        <path d="M21 35.5L28.5 43L43.5 27" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>WebTask<span class="dot">.</span></span>
    </header>
    <div class="pick-body">
      <h1>Pilih mode</h1>
      <p class="lead">Pilih sekali. Aplikasi langsung terbuka sesuai mode.</p>
      <div class="modes" role="group" aria-label="Mode sesi">
        <button class="mode" type="button" id="pick-seb">
          <span class="m-name">Mode SEB</span>
          <span class="m-desc">Kunci penuh untuk ujian. Header config dikirim,
            layar penuh, anti-cheat dinetralkan.</span>
        </button>
        <button class="mode" type="button" id="pick-web">
          <span class="m-name">Mode web biasa</span>
          <span class="m-desc">Browser seperti Chrome. Bisa searching dan membuka
            situs apa pun, jendela normal.</span>
        </button>
      </div>
      <div id="pickmsg" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>

<div id="shell">
<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M16 8H42L54 20V50C54 53.314 51.314 56 48 56H16C12.686 56 10 53.314 10 50V14C10 10.686 12.686 8 16 8Z" fill="#0F172A"/>
      <path d="M42 8V16C42 18.209 43.791 20 46 20H54L42 8Z" fill="#2563EB"/>
      <path d="M21 35.5L28.5 43L43.5 27" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>WebTask<span class="dot">.</span></span>
  </div>
  <div class="brand-sub">Ruang ujian tanpa kunci</div>
</header>

<main>
<div class="wrap">
  <h1>Config ujian</h1>
  <p class="lead" id="mode-line">Mode aktif dimuat dari pilihan awal.</p>

  <div id="msg" role="status" aria-live="polite"></div>

  <div class="section-head">
    <h2>Config tersimpan</h2>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>

  <p class="foot">Config tersimpan di <code>~/.webtask/configs.json</code>.</p>
</div>
</main>
</div>

<script>
const $ = s => document.querySelector(s);
const listEl = $("#list"), countEl = $("#count"), msgEl = $("#msg");
const modeLine = $("#mode-line");

let current = { mode: "seb" };

function setMsg(text, kind){
  msgEl.className = kind || "";
  msgEl.textContent = "";
  if(!text) return;
  const dot = document.createElement("span");
  dot.className = "mark"; dot.setAttribute("aria-hidden","true");
  msgEl.append(dot, document.createTextNode(text));
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}

function post(path, body){
  return fetch(path, {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
  }).then(r => r.json());
}

function openUrl(url){
  post("/api/open", {url});
}

function paintMode(mode){
  if(!modeLine) return;
  modeLine.textContent = mode === "seb"
    ? "Mode SEB aktif. Header config ujian dikirim dan jendela terkunci."
    : "Mode web biasa aktif. Tanpa header config, jendela normal bisa di-resize.";
}

async function refresh(){
  let r;
  try { r = await fetch("/api/state").then(x => x.json()); }
  catch { setMsg("Tidak bisa menghubungi WebTask.", "err"); return; }

  current = { mode: r.mode || "seb" };
  paintMode(current.mode);

  const configs = r.configs || [];
  countEl.textContent = configs.length ? configs.length + " config" : "";
  listEl.textContent = "";

  if(!configs.length){
    const box = el("div","empty");
    box.append(el("strong", null, "Belum ada config."));
    box.append(el("span","next","Tarik file .seb ke jendela ini untuk menambah config ujian."));
    listEl.append(box);
    return;
  }

  for(const c of configs){
    const isCurrent = r.active && c.id === r.active.id;
    const item = el("div","item" + (isCurrent ? " current" : ""));

    const body = el("div","body");
    const name = el("div","name");
    name.append(el("span","file", c.filename || "config.seb"));
    if(isCurrent) name.append(el("span","status on","Aktif"));
    body.append(name);

    const meta = el("div","meta");
    meta.append(el("span", null, c.host || "-"));
    meta.append(el("span","cmid","cmid " + (c.cmid ?? "-")));
    if(c.importedAt) meta.append(el("span", null, c.importedAt));
    body.append(meta);

    const key = el("div","key");
    key.append(document.createTextNode("key"), el("span","val",(c.configKey || "").slice(0,16) + "\u2026"));
    body.append(key);

    const acts = el("div","acts");
    const openBtn = el("button","btn small open", "Buka");
    openBtn.type = "button";
    openBtn.setAttribute("aria-label", "Buka quiz untuk " + (c.filename || "config ini"));
    openBtn.addEventListener("click", () => openUrl(c.startURL));

    const actBtn = el("button","btn small", isCurrent ? "Aktif" : "Aktifkan");
    actBtn.type = "button";
    actBtn.disabled = !!isCurrent;
    actBtn.addEventListener("click", async () => {
      await post("/api/activate", {id: c.id});
      setMsg("Config diaktifkan: " + (c.filename || "config"), "ok");
      refresh();
    });

    const delBtn = el("button","btn small danger","Hapus");
    delBtn.type = "button";
    delBtn.setAttribute("aria-label", "Hapus " + (c.filename || "config ini"));
    delBtn.addEventListener("click", async () => {
      await post("/api/delete", {id: c.id});
      setMsg("Config dihapus.");
      refresh();
    });

    acts.append(openBtn, actBtn, delBtn);
    item.append(body, acts);
    listEl.append(item);
  }
}

async function pickMode(mode){
  if(current.mode === mode) return;
  const r = await post("/api/mode", {mode});
  if(!r.ok){ setMsg(r.error || "Gagal mengganti mode.", "err"); return; }
  current.mode = mode;
  paintMode(mode);
  setMsg(mode === "seb" ? "Mode SEB aktif. Butuh config ujian." : "Mode web biasa aktif.", "ok");
}

/* ---- overlay pilih mode ----
   Rust sudah mengubah ukuran/style jendela sebelum halaman ini selesai dimuat,
   jadi overlay hanya perlu memanggil IPC `pick_mode` lalu menghilang. */
const pickEl = $("#pick");
const pickMsgEl = $("#pickmsg");

function startPicking(){
  document.body.classList.add("picking");
  pickEl.hidden = false;
  const seb = document.querySelector("#pick-seb");
  if(seb) seb.focus();
}

function choose(mode){
  pickMsgEl.textContent = "Membuka mode\u2026";
  try {
    window.ipc.postMessage(JSON.stringify({type:"pick_mode", mode}));
  } catch (e) {
    pickMsgEl.textContent = "Gagal: " + e.message;
    return;
  }
  document.body.classList.remove("picking");
  pickEl.hidden = true;
  if(mode === "web") setMsg("Mode web biasa aktif. Tarik file .seb hanya bila perlu.", "ok");
  else setMsg("Mode SEB aktif. Tarik file .seb untuk membuka quiz.", "ok");
  refresh();
}

document.querySelector("#pick-seb").addEventListener("click", () => choose("seb"));
document.querySelector("#pick-web").addEventListener("click", () => choose("web"));

if(window.__WebTaskPick) startPicking();

async function install(content, filename){
  setMsg("Membaca file\u2026", "busy");
  let r;
  try { r = await post("/api/config", {content, filename}); }
  catch { setMsg("Gagal mengirim file ke WebTask.", "err"); return; }

  if(!r.ok){ setMsg(r.error || "Gagal import.", "err"); return; }
  setMsg("Config terpasang: " + (r.config.filename || "config") + " \u2014 membuka quiz.", "ok");
  refresh();
}

async function fromFile(f){
  if(!f) return;
  if(f.size > 1024 * 1024){ setMsg("File lebih dari 1 MB, tidak wajar untuk config ujian.", "err"); return; }
  const text = await f.text();
  install(text, f.name);
}

window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if(f) fromFile(f);
});

refresh();
</script>
</body>
</html>
